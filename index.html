<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo App</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container py-5">
            <h1 class="text-center mb-4">Todo App</h1>
            <div class="row justify-content-center mb-2">
                <div class="col-12 col-md-8">
                    <div class="input-group">
                        <input type="text" id="taskInput" class="form-control"
                            placeholder="Enter a task">
                        <button id="addBtn" class="btn btn-primary">Add
                            Task</button>
                    </div>
                    <small id="errorMessage" class="text-danger"></small>
                </div>
            </div>
            <div class="row justify-content-center mb-3">
                <div class="col-12 col-md-8">
                    <input type="text" id="searchInput" class="form-control"
                        placeholder="Search tasks...">
                </div>
            </div>
            <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
                <button class="btn btn-outline-primary filter-btn"
                    data-filter="all">All</button>
                <button class="btn btn-outline-warning filter-btn"
                    data-filter="pending">Pending</button>
                <button class="btn btn-outline-success filter-btn"
                    data-filter="completed">Completed</button>
            </div>
             <div class="row text-center mb-4">
            <div class="col-4 count-box p-3">
                <h6>Total</h6>
                <p id="totalCount">0</p>
            </div>
            <div class="col-4 count-box p-3">
                <h6>Pending</h6>
                <p id="pendingCount">0</p>
            </div>
            <div class="col-4 count-box p-3">
                <h6>Completed</h6>
                <p id="completedCount">0</p>
            </div>
        </div>
            <div id="taskList"></div>
        <p id="emptyMessage" class="text-center text-muted">No tasks available.</p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
