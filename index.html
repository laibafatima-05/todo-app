<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo App</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="todo-card bg-white rounded-4 shadow p-4">
                        <h1 class="text-center mb-4">Todo App</h1>
                        <div class="row justify-content-center">
                            <div class="col-12">
                                <div class="input-group">
                                    <input type="text" id="taskInput"
                                        class="form-control  rounded-start-4"
                                        placeholder="Enter a task">
                                    <button id="addBtn"
                                        class="btn btn-primary rounded-end-4">Add</button>
                                </div>
                                <small id="errorMessage"
                                    class="text-danger"></small>
                            </div>
                        </div>
                        <div class="row mt-3 mb-4 align-items-center">
                            <div class="col-12 col-md-7 d-flex justify-content-md-end">
                                <div class="input-group">
                                    <span
                                        class="input-group-text bg-white border-end-0 rounded-start-4">
                                        <i
                                            class="fa-solid fa-magnifying-glass text-muted"></i>
                                    </span>
                                    <input type="text" id="searchInput"
                                        class="form-control border-start-0 rounded-end-4"
                                        placeholder="Search tasks...">
                                </div>
                            </div>
                         <div class="col-12 col-md-5">
                        <div class="dropdown d-flex justify-content-md-end">
                            <button id="statusDropdown"
                                class="btn btn-light border dropdown-toggle"
                                type="button" data-bs-toggle="dropdown">Status
                            </button>
                            <ul class="dropdown-menu">
                                <li>
                                 <button class="dropdown-item filter-btn" data-filter="all">All</button>
                                </li>
                                <li>
                                    <button class="dropdown-item filter-btn"
                                        data-filter="pending">
                                        Pending
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item filter-btn"
                                        data-filter="completed">
                                        Completed
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                        <div class="row text-center mb-4">
                            <div class="col-4 count-box p-3">
                                <h6>Total</h6>
                                <p id="totalCount">0</p>
                            </div>
                            <div class="col-4 count-box p-3">
                                <h6>Pending</h6>
                                <p id="pendingCount">0</p>
                            </div>
                            <div class="col-4 count-box p-3">
                                <h6>Completed</h6>
                                <p id="completedCount">0</p>
                            </div>
                        </div>
                        <div id="taskList"></div>
                        <p id="emptyMessage" class="text-center text-muted">No
                            tasks available.</p>
                    </div>
                </div>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
